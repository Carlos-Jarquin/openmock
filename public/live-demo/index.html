<!doctype html>
<html lang="en-CA">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhead</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: #f2f2f7; color: #111; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  header { padding: 62px 20px 12px; background: #f2f2f7; }
  header h1 { margin: 0; font-size: 32px; letter-spacing: -0.5px; }
  .back { background: none; border: 0; color: #0a66d8; font-size: 17px; padding: 0; margin-bottom: 8px; cursor: pointer; }
  main { flex: 1; overflow-y: auto; padding: 0 16px 100px; -webkit-overflow-scrolling: touch; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .hero { background: linear-gradient(135deg, #2f7d5b, #1b4d6b); color: #fff; }
  .hero h2 { margin: 0 0 4px; font-size: 22px; }
  .row { display: flex; align-items: center; gap: 12px; background: #fff; padding: 14px 16px; border-bottom: 1px solid #e5e5ea; cursor: pointer; }
  .row:first-child { border-radius: 16px 16px 0 0; } .row:last-child { border-radius: 0 0 16px 16px; border-bottom: 0; }
  .dot { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .row small { color: #6e6e73; display: block; }
  .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #0a66d8; color: #fff; font-size: 17px; cursor: pointer; }
  nav { position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: rgba(255,255,255,0.92); border-top: 1px solid #ddd; padding: 8px 0 28px; }
  nav button { flex: 1; background: none; border: 0; font-size: 12px; color: #8e8e93; cursor: pointer; }
  nav button.on { color: #0a66d8; font-weight: 600; }
  label.toggle { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<section class="screen on" id="home">
  <header><h1>Trailhead</h1></header>
  <main>
    <div class="card hero"><h2>Good morning</h2>3 trails near Edmonton are open today.</div>
    <div class="card"><strong>This week</strong><br>12.4 km walked across 4 outings.</div>
    <button class="btn" id="go-trails">Browse trails</button>
  </main>
</section>
<section class="screen" id="trails">
  <header><h1>Trails</h1></header>
  <main><div id="list"></div></main>
</section>
<section class="screen" id="detail">
  <header><button class="back" id="back">‹ Trails</button><h1 id="d-title">Trail</h1></header>
  <main>
    <div class="card" id="d-body"></div>
    <button class="btn" id="save">Save trail</button>
  </main>
</section>
<section class="screen" id="settings">
  <header><h1>Settings</h1></header>
  <main>
    <div class="card"><label class="toggle">Use kilometres <input type="checkbox" checked></label></div>
    <div class="card"><label class="toggle">Trail alerts <input type="checkbox"></label></div>
    <div class="card">Sample app for the Openmock live phone.</div>
  </main>
</section>
<nav>
  <button data-tab="home" class="on">Home</button>
  <button data-tab="trails">Trails</button>
  <button data-tab="settings">Settings</button>
</nav>
<script>
  const names = ['River Valley Loop','Whitemud Ravine','Mill Creek','Terwillegar Park','Hermitage Path','Rundle Park','Fort Edmonton Trail','Elk Island Shoreline','Blackfoot Lake','Kinnaird Ravine','Goldbar Park','Victoria Promenade','Emily Murphy Park','Laurier Park','Larch Sanctuary','Wagner Natural Area','Big Lake Boardwalk','Lois Hole Park','Strathcona Wilderness','Sandy Lake Path','Islet Lake Loop','Beaver Hills Ridge','Ministik Trail','Cooking Lake Ridge','Clover Bar Loop'];
  const colours = ['#2f7d5b','#1b4d6b','#b5651d','#6b4fa0','#c0392b'];
  const list = document.getElementById('list');
  names.forEach((n, i) => {
    const r = document.createElement('div'); r.className = 'row'; r.dataset.i = i;
    r.innerHTML = `<div class="dot" style="background:${colours[i % 5]}"></div><div><strong>${n}</strong><small>${(2 + i * 0.7).toFixed(1)} km · ${['Easy','Moderate','Hard'][i % 3]}</small></div>`;
    r.onclick = () => openTrail(i); list.appendChild(r);
  });
  let current = 'home';
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === (id === 'detail' ? 'trails' : id)));
    current = id; document.body.dataset.screen = id;
  }
  function openTrail(i) {
    document.getElementById('d-title').textContent = names[i];
    document.getElementById('d-body').innerHTML = `${(2 + i * 0.7).toFixed(1)} km, ${['easy','moderate','hard'][i % 3]}. Good for a morning walk with views over the river valley.`;
    document.getElementById('save').textContent = 'Save trail'; show('detail');
  }
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
  document.getElementById('go-trails').onclick = () => show('trails');
  document.getElementById('back').onclick = () => show('trails');
  document.getElementById('save').onclick = e => { e.target.textContent = 'Saved'; };
  document.body.dataset.screen = 'home';
</script>
</body>
</html>
